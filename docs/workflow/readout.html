<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workflow readout</title>
<style>
  :root {
    --ink: #1f2a37; --muted: #5b6878; --line: #c9d1da; --page: #ffffff; --lane: #f4f6f8;
    --band: #3b4652; --phase: #4f7a8a; --badge: #3f6f80;
    --actor: #dfe9ee; --actor-b: #8aa7b4;
    --svc: #ffffff; --svc-b: #2b3540;
    --llm: #fbefc7; --llm-b: #d4b25a;
    --emb: #fbf3db; --emb-b: #d9c38a;
    --api: #cfe1e8; --api-b: #6e98a8;
    --plat: #e3e6e9; --plat-b: #8d969f;
    --opt: #eef0f2; --opt-b: #9aa3ab;
    --gap-b: #c0392b;
    --guard: #e3f2e6; --guard-b: #5e9e6e;
    --eval: #ece6f6; --eval-b: #8a76b8;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 13px/1.45 -apple-system, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; }
  .wrap { padding: 28px 32px 40px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 14px; max-width: 1100px; }
  .meta { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; margin: 0 0 22px; font-size: 12.5px; }
  .meta dt { font-weight: 600; } .meta dd { margin: 0; color: var(--muted); }

  /* ── Diagram ─────────────────────────────────────────────── */
  #diagram { display: inline-block; padding: 18px; background: var(--page); }
  .grid { display: grid; gap: 6px; }
  .uc { background: var(--band); color: #fff; font-weight: 700; font-size: 12px; padding: 7px 10px; border-radius: 3px; }
  .ph { background: var(--phase); color: #fff; font-weight: 600; font-size: 11.5px; padding: 6px 10px; border-radius: 2px; }
  .lanehead { background: var(--lane); padding: 12px 10px; border-left: 4px solid var(--phase); }
  .lanehead b { display: block; font-size: 12.5px; }
  .lanehead span { display: block; color: var(--muted); font-size: 10.5px; margin-top: 3px; }
  .cell { background: var(--lane); padding: 8px 7px; display: flex; flex-direction: column; gap: 8px; border-left: 1px solid #dfe4e9; }
  .gapcol { background: repeating-linear-gradient(135deg, #f1f3f5 0 6px, #e6e9ec 6px 12px); border: 1px dashed #b9c1c9; display: flex; align-items: center; justify-content: center; }
  .gapcol span { writing-mode: vertical-rl; transform: rotate(180deg); color: var(--muted); font-size: 11px; font-weight: 600; text-align: center; padding: 8px 0; }
  .box { position: relative; border: 1.4px solid; border-radius: 4px; padding: 7px 8px 8px; font-size: 10.6px; line-height: 1.38; }
  .box .tag { font-size: 9px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-bottom: 2px; }
  .box .t { font-weight: 700; font-size: 11.4px; margin-bottom: 3px; padding-right: 20px; }
  .box .b { color: #33404d; overflow-wrap: anywhere; }
  .box code { font-size: 10px; background: rgba(255,255,255,.55); padding: 0 2px; border-radius: 2px; }
  .badge { position: absolute; top: 6px; right: 6px; width: 18px; height: 18px; border-radius: 50%; background: var(--badge); color: #fff; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .k-actor { background: var(--actor); border-color: var(--actor-b); }
  .k-service { background: var(--svc); border-color: var(--svc-b); }
  .k-llm { background: var(--llm); border-color: var(--llm-b); }
  .k-embedding { background: var(--emb); border-color: var(--emb-b); border-style: dashed; }
  .k-api { background: var(--api); border-color: var(--api-b); }
  .k-platform { background: var(--plat); border-color: var(--plat-b); }
  .k-optional { background: var(--opt); border-color: var(--opt-b); border-style: dashed; }
  .k-notintegrated { background: #fff; border-color: var(--gap-b); border-style: dashed; }
  .k-notintegrated .tag { color: var(--gap-b); }
  .k-guardrail { background: var(--guard); border-color: var(--guard-b); }
  .k-eval { background: var(--eval); border-color: var(--eval-b); }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; margin-top: 14px; font-size: 11px; color: var(--muted); }
  .legend i { display: inline-block; width: 22px; height: 13px; border: 1.4px solid; border-radius: 3px; vertical-align: -2px; margin-right: 6px; }
  .legend .n { width: 16px; height: 16px; border-radius: 50%; background: var(--badge); border: 0; }
  .foot { display: flex; justify-content: space-between; gap: 20px; margin-top: 8px; font-size: 10.5px; color: var(--muted); }

  /* ── Readout text ─────────────────────────────────────────── */
  .text { max-width: 1180px; margin-top: 34px; }
  .text h2 { font-size: 17px; margin: 30px 0 6px; padding-top: 12px; border-top: 1px solid var(--line); }
  .text h3 { font-size: 13.5px; margin: 18px 0 6px; color: var(--phase); }
  .text p.intro { color: var(--muted); margin: 0 0 10px; }
  ol.steps { list-style: none; padding: 0; margin: 0; }
  ol.steps li { display: grid; grid-template-columns: 28px 1fr; gap: 8px; margin: 0 0 7px; }
  ol.steps li .num { width: 20px; height: 20px; border-radius: 50%; background: var(--badge); color: #fff; font-size: 10.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; margin-top: 1px; }
  table { border-collapse: collapse; width: 100%; font-size: 12px; margin: 6px 0 4px; }
  th, td { text-align: left; vertical-align: top; padding: 6px 9px; border-bottom: 1px solid var(--line); }
  th { background: var(--lane); font-weight: 600; }
  td code, li code { font-size: 11.5px; background: #f2f4f6; padding: 0 3px; border-radius: 3px; }
  ul.bul { margin: 4px 0 0 18px; padding: 0; } ul.bul li { margin: 0 0 4px; }
  body.diagram-only .text, body.diagram-only .head { display: none; }
  body.diagram-only .wrap { padding: 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><h1 id="title"></h1><p class="sub" id="subtitle"></p><dl class="meta" id="meta"></dl></div>
  <div id="diagram"></div>
  <div class="text" id="text"></div>
</div>

<!-- The project's readout data: the only part that changes between projects. -->
<script id="workflow-data" type="application/json">{"title":"Vexa — end-to-end workflow","subtitle":"How an owner sets Vexa up, how every call is answered, understood and acted on, and what happens after it ends. Each box names the exact code path, model, API or data store involved; numbered badges match the step-by-step walkthrough below.","meta":[{"k":"Scope","v":"UC1 Set up the assistant · UC2 Answer a call (live phone calls and in-app test calls) · UC3 After the call. Personal and Business modes share the same pipeline. · Wave 1: seven business packs and the scam shield (in-app test calls)"},{"k":"Source of truth","v":"github.com/Phani3108/Vexa · branch `wave1` · commit `3568e5d` · 29 Oct 2026 · backend/src, web/src, backend/.env.example, Dockerfile, docker-compose.yml, .github/workflows, backend/test, backend/eval"},{"k":"Planned items","v":"From ROADMAP.md (India-first plan): Indian speech engines and voices, Indian phone number, WhatsApp, UPI, calendar and CRM. Drawn as Not integrated."},{"k":"Live status","v":"Text understanding, flows, analysis, translation and the app run end to end today. The live phone path (Twilio + OpenAI Realtime) is complete in code but has not been run on a real call: no Twilio or OpenAI keys are configured."},{"k":"Prepared by","v":"Phani Marupaka with Claude Code · 29 Oct 2026"}],"useCases":[{"id":"UC1","title":"Set up the assistant","phases":["p1","p2"]},{"id":"UC2","title":"Answer a call","phases":["p3","p4","p5","p6"]},{"id":"UC3","title":"After the call","phases":["p7","p8"]}],"phases":[{"id":"p1","title":"1 Sign in","width":280},{"id":"p2","title":"2 Configure flows, business and languages","width":270},{"id":"g1","gap":true,"text":"Outside the system: the owner forwards calls from their carrier to the Vexa Twilio number"},{"id":"p3","title":"3 Ring and screen","width":280},{"id":"p4","title":"4 Listen and understand","width":290},{"id":"p5","title":"5 Decide and reply","width":290},{"id":"p6","title":"6 Hand off or steer","width":270},{"id":"p7","title":"7 Save and analyse","width":280},{"id":"p8","title":"8 Act and follow up","width":280}],"lanes":[{"id":"ui","title":"People and UI","subtitle":"what owners and callers see and do"},{"id":"svc","title":"Service code","subtitle":"deterministic orchestration and entry routes"},{"id":"ai","title":"AI models","subtitle":"every Claude and OpenAI call"},{"id":"api","title":"Platform and integration APIs","subtitle":"outbound calls, method and path"},{"id":"data","title":"Data and platform services","subtitle":"stores, memory, history"},{"id":"guard","title":"Guardrails and evals","subtitle":"what protects and what measures"}],"boxes":[{"phase":"p1","lane":"ui","kind":"actor","badge":1,"tag":"Owner · Web app (PWA) / mobile","title":"Sign in with a phone number","body":"Enters a number, receives a 6-digit code. `POST /api/auth/otp/request` → `POST /api/auth/otp/verify`."},{"phase":"p1","lane":"svc","kind":"service","badge":2,"tag":"otpService · auth middleware","title":"Verify code, issue tokens","body":"Code stored as SHA-256 hash, 10-minute expiry, 5 attempts. Issues JWT access (7 days) and refresh (30 days). First login creates the account (id = phone number)."},{"phase":"p1","lane":"api","kind":"api","badge":3,"tag":"Twilio Verify / SMS","title":"Send the code","body":"`verify.v2.services(…).verifications` when `TWILIO_VERIFY_SERVICE_SID` is set, else `messages.create`. In development the code is returned on screen instead (`devCode`)."},{"phase":"p1","lane":"data","kind":"platform","badge":4,"tag":"MongoDB · OtpCode, UserConfig","title":"Codes and accounts","body":"TTL index deletes expired codes. Embedded MongoDB in development (`backend/.data/mongo`); `MONGODB_URI` required in production."},{"phase":"p1","lane":"guard","kind":"guardrail","badge":5,"tag":"Guardrail","title":"Rate limits and secret checks","body":"Code requests 5 per 15 min per IP and phone; checks 20 per 15 min. Production refuses to start with a missing or default `JWT_SECRET`."},{"phase":"p2","lane":"ui","kind":"actor","badge":6,"tag":"Owner · Onboarding, Settings, Flows","title":"Choose mode and teach Vexa the business","body":"Personal or Business, industry template, hours, catalog (stock, price), FAQs, VIPs, greeting language, recording. `POST /api/users/onboarding`, `PUT /api/users/config`, `PUT /api/workflows/:id`."},{"phase":"p2","lane":"svc","kind":"service","badge":7,"tag":"Flow templates · validate.js","title":"17 built-in call flows","body":"10 business (booking, quote, stock & price, directions, emergency…) and 7 personal (delivery, bank & loan, family, spam…). Edited flows are validated: known step types, valid targets, at least one end step, `maxTurns` 2–20."},{"phase":"p2","lane":"ai","kind":"llm","badge":8,"tag":"Claude · main model","title":"Ask Vexa commands","body":"`assistantService.runCommand` → `structuredJson(COMMAND_SCHEMA)`: \"Focus until 7 pm\", \"block that number\", \"tell Dana her parts arrived\". Offline grammar if the model is unavailable. `POST /api/assistant/command`."},{"phase":"p2","lane":"data","kind":"platform","badge":9,"tag":"MongoDB · UserConfig, Caller","title":"Owner settings and caller notes","body":"Business profile and catalog, VIP and blocked numbers, shield (standard, focus, aggressive, silent), recording {on, announce, keep 90 days}, notes to pass on next call."},{"phase":"p2","lane":"guard","kind":"guardrail","badge":10,"tag":"Guardrail","title":"Whitelisted edits and caps","body":"Only `EDITABLE_FIELDS` can change. Ask Vexa 30/min, at most 5 actions, Focus capped at 7 days. Built-in flows can't be deleted; the fallback flow can't be turned off."},{"phase":"p3","lane":"ui","kind":"actor","badge":11,"tag":"Caller · any phone · or owner test call","title":"Someone calls the owner","body":"The carrier forwards the call to the Vexa Twilio number. Owners can also run a test call in the app (`POST /api/simulator/start`), typed or by browser mic."},{"phase":"p3","lane":"svc","kind":"service","badge":12,"tag":"voice.js · callSession.openCallSession","title":"Screen before answering","body":"`POST /voice/incoming-call`: finds the owner, reads caller memory, VIP, Focus and hours, scores spam risk. Blocked numbers, and risk ≥ 80 on the aggressive shield, are rejected before any AI cost. Returns TwiML `<Connect><Stream>`."},{"phase":"p3","lane":"ai","kind":"llm","badge":13,"tag":"OpenAI Realtime · gpt-realtime-mini","title":"Speak the greeting","body":"Says the engine's greeting exactly (VIPs by name), plus \"This call may be recorded.\" unless the owner turned the notice off. Translated to the owner's greeting language."},{"phase":"p3","lane":"api","kind":"api","badge":14,"tag":"Twilio Voice","title":"Webhooks and media stream","body":"`POST /voice/incoming-call`, `POST /voice/call-status`; WebSocket `/voice/media-stream` carries 8 kHz μ-law audio both ways."},{"phase":"p3","lane":"data","kind":"platform","badge":15,"tag":"History read · callHistoryService","title":"Who is this caller?","body":"Caller record, last 5 calls from the number, last 5 in the same category: name, summary so far, notes to deliver, always-transfer, spam count. Test calls never read or write memory."},{"phase":"p3","lane":"guard","kind":"guardrail","badge":16,"tag":"Guardrail","title":"Signature, risk score, shields","body":"Twilio signature checked in production (`TWILIO_VALIDATE_SIGNATURE`). Call audio stream accepted only with a single-use token signed for that call (`lib/streamToken.js`), else closed. Risk score 0–100 (no caller ID, past spam, call bursts, spoofing)."},{"phase":"p4","lane":"ui","kind":"actor","badge":17,"tag":"Owner · live call screen","title":"Watch the call live","body":"Transcript, facts filling in, caller's language, all over Socket.io (`call:transcript`, `call:language`)."},{"phase":"p4","lane":"svc","kind":"service","badge":18,"tag":"VoiceAgent · callSession.takeTurn","title":"Clean the transcript, one turn at a time","body":"Drops noise, greeting echo, URLs, gibberish and the fragment after an interruption; ignores \"haan\"/\"hmm\" said over Vexa. Test calls enter at `POST /api/simulator/:id/message`."},{"phase":"p4","lane":"ai","kind":"llm","badge":19,"tag":"OpenAI · gpt-4o-mini-transcribe","title":"Speech to text","body":"Transcribes the caller inside the Realtime session. Server VAD 0.6, 700 ms silence. On flow calls the model never replies on its own (`create_response:false`)."},{"phase":"p4","lane":"ai","kind":"llm","badge":20,"tag":"Claude · fast model","title":"Per-turn understanding","body":"`nlu.understand()`: flow, facts in English, answer from business info, emergency, wants a person, language, mixed with English, English translation, yes/no. Hard timeout `NLU_TIMEOUT_MS` (5 s)."},{"phase":"p4","lane":"data","kind":"platform","badge":21,"tag":"In memory","title":"Active call state","body":"`VoiceAgent.activeCalls`: context, flow session, transcript, recording buffer. Lost on restart; test sessions expire after 30 min."},{"phase":"p4","lane":"guard","kind":"guardrail","badge":22,"tag":"Guardrail","title":"Offline understanding fallback","body":"On timeout or error the rules in `extractors.js` + `indic.js` answer: lakh/dedh, kal/parso, \"5 baje\", haan/avunu/illa, +91 numbers, Hinglish in English letters."},{"phase":"p4","lane":"guard","kind":"eval","badge":23,"tag":"Eval · offline","title":"Indian-language test set","body":"161 cases + 50 held-out, 8 languages. Without the model 99% / 98%; with Claude 100% / 100%. `npm run eval:nlu`."},{"phase":"p5","lane":"ui","kind":"actor","badge":24,"tag":"Caller","title":"Hears the answer in their language","body":"Telugu → Hindi → English mid-call is followed; Hinglish is answered in Hinglish; prices and totals come from the catalog."},{"phase":"p5","lane":"svc","kind":"service","badge":25,"tag":"Flow engine · engine.turn()","title":"Decide the next step","body":"Emergency switch → pick the flow → confirm or correct → answer side questions → fill several facts at once → next step: ask, confirm, catalog lookup, branch, act, transfer, end."},{"phase":"p5","lane":"ai","kind":"llm","badge":26,"tag":"Claude · fast model","title":"Grounded directions","body":"Delivery flow only: `groundedDirections()` turns the saved address and gate notes into directions from where the courier is. \"Use ONLY the facts provided\"; 6 s; template if it fails."},{"phase":"p5","lane":"ai","kind":"llm","badge":27,"tag":"OpenAI Realtime · voice","title":"Speak the reply","body":"`speakInstruction`: the engine's English line spoken in the caller's language, mixed with English if they mix. Voice from owner settings."},{"phase":"p5","lane":"ai","kind":"llm","badge":28,"tag":"Claude · fast model","title":"Reply translation (test calls)","body":"`translateText` writes the reply in the caller's language and script. Skipped on live calls (the voice translates). Falls back to English."},{"phase":"p5","lane":"data","kind":"platform","badge":29,"tag":"MongoDB · businessProfile","title":"Catalog and business facts","body":"Stock, unit price, aliases; address, directions, hours, FAQs. The only facts Vexa may state."},{"phase":"p5","lane":"guard","kind":"guardrail","badge":30,"tag":"Guardrail","title":"Engine limits and answer rules","body":"10 turns max, 2 re-asks then a partial message; answers only from business info; owner text sanitized against prompt injection; caller cuts in only after 600 ms (`BARGE_IN_MS`)."},{"phase":"p6","lane":"ui","kind":"actor","badge":31,"tag":"Owner · handoff prompt and Copilot","title":"Pick up, or steer the call","body":"\"Pick up or let Vexa handle it\" (`call:handoff`). Send a note, ask for email, transfer, end: `POST /voice/whisper`, `/voice/takeover`, `/voice/end-call`."},{"phase":"p6","lane":"svc","kind":"service","badge":32,"tag":"Transfer rules · takeover","title":"Decide who gets through","body":"VIPs and always-transfer callers; emergencies (unless after-hours transfer is off); never during Focus; business numbers only when open. Owner-only (`ownedCall`)."},{"phase":"p6","lane":"api","kind":"api","badge":33,"tag":"Twilio · Conference","title":"Bridge the owner in","body":"Caller moved into `<Dial><Conference>`; owner dialed with a spoken summary; hang up with `calls(sid).update`."},{"phase":"p6","lane":"api","kind":"optional","badge":34,"tag":"Optional · Firebase Cloud Messaging","title":"Push to the owner's phone","body":"`admin.messaging().send`: live call, urgent, summary. Needs `FIREBASE_SERVICE_ACCOUNT`; off otherwise."},{"phase":"p6","lane":"data","kind":"platform","badge":35,"tag":"Socket.io · JWT handshake","title":"Live events to the app","body":"Room `user:<id>`: transcript, language, handoff, urgent, booking requested, analyzed."},{"phase":"p6","lane":"guard","kind":"guardrail","badge":36,"tag":"Guardrail","title":"Emergencies always win","body":"Escalation words or the model's emergency flag switch to the Emergency flow and alert the owner during the call. Silent shield stops pushes."},{"phase":"p7","lane":"svc","kind":"service","badge":37,"tag":"callSession.finalizeCallSession","title":"Close the record","body":"Builds the bilingual transcript, runs analysis, lets the flow's facts win for lead, name and spam, updates caller memory (real calls only), saves the cost ledger as `aiUsage`."},{"phase":"p7","lane":"ai","kind":"llm","badge":38,"tag":"Claude · main model","title":"Post-call analysis","body":"`ConversationAnalyzer`: category, summary, sentiment, urgency, lead, spam. 30 s; keyword fallback if it fails."},{"phase":"p7","lane":"ai","kind":"llm","badge":39,"tag":"Claude · main + fast","title":"Transcript and summary translation","body":"`translateLines`: every line to English in one request. `translateText`: summary in the caller's language and script (`summaryLocal`)."},{"phase":"p7","lane":"data","kind":"platform","badge":40,"tag":"MongoDB · Call, Caller, Booking","title":"Call history written","body":"Transcript (as spoken + English), analysis, flow run, languages, AI usage, recording metadata; caller summary and spam counts."},{"phase":"p7","lane":"data","kind":"platform","badge":41,"tag":"Disk · RECORDINGS_DIR","title":"Call recording","body":"Stereo WAV, caller left and Vexa right, from the media stream; 2-hour cap. Deleted after `retentionDays` (default 90). Docker keeps them on a `recordings` volume."},{"phase":"p7","lane":"guard","kind":"eval","badge":42,"tag":"Eval · runtime","title":"Quality signals on every call","body":"Model used or not per turn (`aiAssisted`), latency, tokens and cost by purpose, questions asked and skipped, risk score, status of every action."},{"phase":"p8","lane":"ui","kind":"actor","badge":43,"tag":"Owner · Activity, Call detail, Bookings","title":"Read, listen, act","body":"Summary in English + caller's language, bilingual transcript, \"Read in…\" 8 languages, recording player (tap a line to jump), approve bookings, send the reply."},{"phase":"p8","lane":"svc","kind":"service","badge":44,"tag":"outcomes.js","title":"Outcomes","body":"Add to inbox, booking request, text the caller, notify the owner, mark spam. Each records done, sent, simulated, skipped or failed."},{"phase":"p8","lane":"ai","kind":"llm","badge":45,"tag":"Claude · main + fast","title":"Read the call in any language","body":"`POST /api/calls/:id/translate`: whole call and summary in any of 8 languages; saved in `Call.translations`, so it's paid once."},{"phase":"p8","lane":"api","kind":"api","badge":46,"tag":"Twilio SMS","title":"Texts to the caller","body":"`messages.create` (≤ 640 chars): booking confirmed or declined, reply drafts. Simulated for test calls; skipped if Twilio isn't configured."},{"phase":"p8","lane":"data","kind":"notintegrated","badge":47,"tag":"Not integrated · Planned (ROADMAP.md)","title":"Calendar, CRM, WhatsApp","body":"Bookings are requests, not calendar slots; no CRM sync or WhatsApp messages yet."},{"phase":"p8","lane":"guard","kind":"guardrail","badge":48,"tag":"Guardrail","title":"Owner approves; links expire","body":"AI only requests bookings; the owner confirms (`PATCH /api/bookings/:id`). Recordings play through 15-minute signed links; audio can be deleted per call."},{"phase":"p8","lane":"guard","kind":"eval","badge":49,"tag":"Eval · release","title":"Test suites","body":"62 backend tests and the offline understanding gate (≥ 97%, held-out ≥ 95%) run in GitHub Actions with the web build and Docker image. 9 mobile tests. **Partial:** no web unit tests yet."},{"phase":"p2","lane":"svc","kind":"service","badge":50,"tag":"Service · Packs","title":"Install a business pack","body":"`POST /api/packs/:id/install`: 7 packs (clinic, salon, restaurant, kirana, home services, coaching, real estate) lay their flows over the built-ins and can load a sample business (prices, records, listings, UPI ID)."},{"phase":"p4","lane":"guard","kind":"guardrail","badge":51,"tag":"Guardrail · Every turn","title":"Scam shield","body":"Checked before anything else: model `scam` label, else `scam.js` two-signal detector (digital arrest, fake courier, KYC/SIM block, impostor relative, prize) or any OTP/PIN/AnyDesk request. Call ends, nothing shared, owner alerted (`call:scam`, push), evidence saved."},{"phase":"p5","lane":"svc","kind":"service","badge":52,"tag":"Service · Engine","title":"Orders, records, listings","body":"Carts grow across turns (\"aur do lassi\") with exact totals; order/report/fee status read only to the phone on the record; listings matched by size, budget, area."},{"phase":"p5","lane":"guard","kind":"guardrail","badge":53,"tag":"Guardrail · Packs","title":"Refusal rules","body":"Each pack names what Vexa must not do: medical advice, allergen promises, fixed quotes, mark guarantees, treatment safety, filtering homes by religion, caste or diet. Polite refusal, then the call carries on."},{"phase":"p8","lane":"api","kind":"api","badge":54,"tag":"Integration · UPI","title":"Payment link by text","body":"`pay_link` builds a `upi://pay` link for the exact total and texts it (Twilio SMS). Above the account limit (₹5,000 default) it waits for the owner. No gateway; simulated on test calls."},{"phase":"p8","lane":"guard","kind":"eval","badge":55,"tag":"Eval · CI gate","title":"Pack + scam eval","body":"71 scripted calls (`npm run eval:packs`): 45 across 7 packs, 26 scam scripts and lookalike genuine calls. Gate 100% with zero leaks; offline 71/71, scam precision and recall 1.0."}],"footnote":"Flows decide; models only read and speak. Optional = needs a credential to switch on. In memory = lost on restart. Not integrated = planned, not in code.","source":"Source of truth: Phani3108/Vexa, branch wave1 (commit 3568e5d, 29 Oct 2026)","steps":[{"group":"UC1 · Sign in","items":[{"n":1,"text":"The owner opens the Vexa app (installable web app, or the mobile app) and enters a phone number. The app calls `POST /api/auth/otp/request`, then `POST /api/auth/otp/verify` with the 6-digit code."},{"n":2,"text":"The server stores only a hash of the code, accepts it for 10 minutes and allows 5 tries. A correct code returns a 7-day access token and a 30-day refresh token. The first login creates the account."},{"n":3,"text":"The code is sent by Twilio Verify, or as a plain Twilio SMS. In development no SMS is sent and the code is shown on screen."},{"n":4,"text":"Codes and accounts live in MongoDB. Expired codes delete themselves."},{"n":5,"text":"Rate limits stop code guessing and SMS abuse, and production will not start with a weak signing secret."}]},{"group":"UC1 · Configure flows, business and languages","items":[{"n":6,"text":"The owner picks Personal or Business, an industry template, opening hours, a product catalog with stock and prices, FAQs, VIP contacts, the greeting language and recording settings."},{"n":7,"text":"Vexa ships 17 ready-made call flows. Owners can edit them step by step; every edit is checked before it is saved, so a flow can't loop or dead-end."},{"n":8,"text":"Owners can also just say what they want (\"I'm busy until 7 pm\", \"block that number\"). Claude turns that into actions; a rule-based parser takes over if Claude is unavailable."},{"n":9,"text":"Settings, the catalog, shields and notes for specific callers are stored in MongoDB."},{"n":10,"text":"Only approved fields can be edited, commands are rate-limited and capped, and the built-in safety flows can't be removed."},{"n":50,"text":"A business can install a ready-made pack for its trade. Its flows replace the generic ones and a sample business can be loaded to try it at once (`POST /api/packs/:id/install`)."}]},{"group":"UC2 · Ring and screen","items":[{"n":11,"text":"A caller dials the owner. The owner's carrier forwards the call to the Vexa Twilio number. Owners can rehearse the same pipeline with an in-app test call."},{"n":12,"text":"Before answering, Vexa finds the owner, recalls the caller, checks VIPs, Focus and business hours, and scores spam risk. Blocked or very risky callers are rejected before any AI cost. Twilio is told to stream the audio to Vexa."},{"n":13,"text":"The OpenAI Realtime voice speaks the greeting written by the flow engine, including the recording notice."},{"n":14,"text":"Twilio sends call events to Vexa's webhooks and streams the audio in both directions over a WebSocket."},{"n":15,"text":"Caller history is read: their name, what past calls were about, any note the owner left for them, and whether they are usually spam."},{"n":16,"text":"Twilio signatures are verified in production, and the call's audio stream is only accepted with a single-use token signed for that exact call. The risk score and the owner's shield decide how strict to be."}]},{"group":"UC2 · Listen and understand","items":[{"n":17,"text":"The owner can watch the call live: the transcript, the facts Vexa has captured and the caller's language."},{"n":18,"text":"Each caller sentence is cleaned (noise, echoes and false starts are dropped) and processed in order, one turn at a time."},{"n":19,"text":"OpenAI turns the caller's speech into text. On flow calls the voice model never answers on its own; the flow engine decides every reply."},{"n":20,"text":"Claude reads each sentence and returns structured facts in English: which flow, names, dates, quantities, any question, an emergency, the language and an English translation. It has 5 seconds."},{"n":21,"text":"The live call's state is kept in server memory and is lost if the server restarts."},{"n":22,"text":"If Claude is slow or down, built-in rules understand Indian numbers, dates, yes/no and phone numbers in eight languages, so the call keeps going."},{"n":23,"text":"This understanding is measured on 211 test sentences in eight languages, including 50 held back from tuning."},{"n":51,"text":"Every sentence is first checked by the scam shield. A fraud script or a request for an OTP, PIN or screen-sharing app ends the call at once; nothing about the owner is shared, the owner is alerted and the phrases are saved as evidence."}]},{"group":"UC2 · Decide and reply","items":[{"n":24,"text":"The caller hears the answer in the language they are using right now, even when they switch mid-call."},{"n":25,"text":"The flow engine, not the model, decides what happens next: switch to emergency, confirm, answer a side question, look up stock and price, transfer or end. Several facts can be captured from one sentence."},{"n":26,"text":"For deliveries, Claude writes directions to the owner's home from the courier's location, using only the saved address and gate notes."},{"n":27,"text":"The voice speaks the engine's line in the caller's language, mixing in English the way the caller does."},{"n":28,"text":"On test calls, Claude translates the reply in text; on live calls the voice does it, which saves a request."},{"n":29,"text":"Prices, stock, hours, address and FAQs come from the owner's profile, so Vexa never guesses a number."},{"n":30,"text":"Calls are capped at 10 turns, unanswered questions end in a message for the owner, and answers are limited to the owner's own business information."},{"n":52,"text":"Pack flows take orders item by item with an exact total, tell callers their order, report or fee status (only to the phone number on the record), and match property listings."},{"n":53,"text":"Pack refusal rules stop Vexa giving medical advice, allergen promises, fixed quotes, guaranteed marks or discriminatory property filters; it refuses politely and carries on."}]},{"group":"UC2 · Hand off or steer","items":[{"n":31,"text":"When a call needs the owner, their app asks \"pick up, or let Vexa handle it?\". During any call the owner can send Vexa a note, ask it to collect an email, transfer or end the call."},{"n":32,"text":"Clear rules decide who gets through: VIPs and chosen callers, emergencies, nobody during Focus, and business calls only during opening hours."},{"n":33,"text":"To transfer, Twilio moves the caller into a conference and calls the owner with a short spoken summary first."},{"n":34,"text":"Push notifications go to the owner's phone through Firebase, when it is configured."},{"n":35,"text":"All live updates reach the owner's app over an authenticated Socket.io connection."},{"n":36,"text":"Emergencies always override other settings and alert the owner while the call is still going."}]},{"group":"UC3 · Save and analyse","items":[{"n":37,"text":"When the call ends, Vexa builds a transcript with every line as spoken plus English, saves the outcome, updates what it knows about the caller and records the exact AI cost."},{"n":38,"text":"Claude summarises the call: category, summary, urgency, whether it is a lead or spam."},{"n":39,"text":"Claude translates the transcript into English and writes the summary in the caller's language too."},{"n":40,"text":"Everything is saved in MongoDB as the call history that future calls draw on."},{"n":41,"text":"The recording is saved as a stereo audio file (on a persistent volume in Docker) and deleted automatically after the owner's retention period."},{"n":42,"text":"Every call carries quality signals: whether the model was used each turn, latency, tokens and cost by purpose, and how many questions were skipped."}]},{"group":"UC3 · Act and follow up","items":[{"n":43,"text":"The owner reads the call in English and the caller's language, listens to the recording, approves bookings and sends a reply."},{"n":44,"text":"Each outcome (inbox, booking request, text, alert, spam tag) is recorded with whether it was done, simulated or skipped."},{"n":45,"text":"The owner can read any call in any of the eight languages; the translation is saved, so it is paid for once."},{"n":46,"text":"Confirmation texts and replies go out by Twilio SMS. Test calls only simulate them."},{"n":47,"text":"Calendar booking, CRM sync, WhatsApp and UPI payment links are planned, not built."},{"n":48,"text":"A person approves every booking, and recordings can only be played through short-lived links."},{"n":49,"text":"Every change runs 47 backend tests, the understanding test gate, the web build and the Docker build in CI; 9 mobile tests also exist."},{"n":54,"text":"For orders, Vexa texts a UPI payment link for the exact total; above the owner's limit the link waits for approval."},{"n":55,"text":"Every change runs 71 scripted pack and scam calls in CI; any failure or leak blocks the release."}]}],"sections":[{"title":"Data and history calls","intro":"What Vexa reads and writes about past calls, callers and the owner, and what is lost or not integrated.","table":{"cols":["Source","Read or written","When","Notes"],"rows":[["Caller memory (`Caller`, last 5 calls by number, last 5 in category)","Read","Start of every call (`getCallerContext`)","Name, running summary (600 chars), notes to deliver, always-transfer, spam and short-call counts. Test calls excluded."],["Caller memory update","Written","End of every real call (`_updateCallerProfile`)","Appends to the summary; one-time notes are removed once delivered. Test calls never write."],["Owner config (`UserConfig`)","Read","Every call and turn","Business profile, catalog, hours, FAQs, VIPs, blocked numbers, shield, Focus times, recording settings, flows."],["Call record (`Call`)","Written","End of call (`saveCall`)","Transcript as spoken + English, analysis, local-language summary, flow run, languages, AI usage, recording metadata, follow-up status."],["Bookings (`Booking`)","Written / updated","Booking flow; owner approval","Status requested → confirmed / declined; customer is texted."],["Recordings (disk)","Written / read / deleted","Live calls; playback; every 6 h sweep","Stereo WAV in `RECORDINGS_DIR`, signed 15-minute playback links, retention default 90 days."],["Translations cache (`Call.translations`)","Written / read","\"Read in…\" on call detail","Saved per language so repeat views cost nothing."],["Active calls, test sessions, translation cache, rate-limit counters","In memory","During calls","Lost on restart; a single server instance only (no Redis store)."],["Redis (`config/redis.js`)","Not used","—","Client defined but never imported."],["Calendar, CRM, WhatsApp, UPI, Indian telephony","Not integrated","—","Planned in ROADMAP.md."],["Pack data (`UserConfig.businessProfile`: catalog, records, listings, UPI ID; `packs`)","Read / written","Pack install; every pack call","Records are answered only to the phone number on them; sample data is optional."],["Scam evidence (`Call.analysis.scam`)","Written","Scam call ends","Type, label and the caller's phrases; call tagged spam, category \"Scam blocked\"."]]}},{"title":"LLM calls","intro":"Claude is used for all text intelligence when `ANTHROPIC_API_KEY` is set (OpenAI chat is the fallback provider). OpenAI Realtime handles live speech. Every Claude call is metered per call (tokens, cost, latency).","table":{"cols":["Call (function)","Model","When it runs","What it produces","Switch / flag"],"rows":[["Per-turn understanding · `nlu.understand()`","Claude fast model (`ANTHROPIC_FAST_MODEL`, else `ANTHROPIC_MODEL` = drail","What it prevents","Where it is enforced","Default and flag"],"rows":[["Login and tokens","Account takeover, code guessing","`otpService.js`, `middleware/auth.js`","Hashed codes, 10 min, 5 tries; JWT 7 d / 30 d; production requires `JWT_SECRET`"],["Rate limits","Abuse and runaway cost","`app.js`, `routes/auth.js`, `simulator.js`, `assistant.js`","API 600/15 min; codes 5/15 min; test calls 40/min; commands 30/min; outbound calls 10/min (in memory)"],["Owner isolation","One owner seeing another's calls","Every query scoped by `req.userId`; `ownedCall()` for live calls","On"],["Twilio signature","Forged call webhooks","`routes/voice.js` `twilioWebhook`","On in production; `TWILIO_VALIDATE_SIGNATURE`"],["Call audio stream token","A stranger opening a call's audio socket and driving the AI","`lib/streamToken.js`, `VoiceAgent.handleMediaStream`","On (single-use, 2-minute, bound to the call id); socket closed if no valid start within 5 s; `STREAM_AUTH=off` ignored in production"],["Spam screening","Robocalls and spoofing reaching the owner","`workflows/risk.js`, `routes/voice.js`","Risk 0–100; blocked numbers rejected; aggressive shield rejects ≥ 80"],["Flow validation","Broken, looping or dead-end flows","`workflows/validate.js`","Known steps only, valid targets, end step required, `maxTurns` 2–20"],["Engine limits","Endless calls","`workflows/engine.js`","10 turns, 2 re-asks, 50-step loop guard; partial message saved"],["Emergency override","Missing a real emergency","`engine.js` emergency switch, `callSession.js` urgent alert","Escalation words + model flag; owner alerted mid-call"],["Who gets through","Interruptions the owner didn't want","`engine.js` `transfer_allowed`","VIP / always-transfer / emergency; never in Focus; business hours"],["Human approval","AI committing the owner","`outcomes.js`, `PATCH /api/bookings/:id`","Bookings are requests until the owner confirms"],["Grounded answers","Made-up prices, hours or directions","`nlu.js`, `callSession.js` directions prompt, `PromptGenerator.js`","\"Answer ONLY from\" business info; catalog for prices"],["Prompt-injection sanitizer","Owner or caller text taking over prompts","`PromptGenerator._sanitize`","Strips \"ignore previous instructions\", \"system prompt\" and similar"],["Model failure fallbacks","A slow or refusing model stalling a call","`nlu.js`, `translate.js`, `claude.js`, `ConversationAnalyzer.js`","Hard timeouts; offline rules; English; keyword analysis; refusal fallback (`ANTHROPIC_FALLBACKS`)"],["Transcript filters","Acting on noise or echoes","`VoiceAgent.js` transcript handler","Noise, echo, URL, gibberish, post-interruption fragments dropped; backchannels ignored"],["Recording consent and retention","Recording without notice; keeping audio forever","`callSession.js`, `media.js`","Notice on; 90 days; per-call delete; 15-minute signed links"],["Dev-only routes","Demo data in production","`users.js`, `media.js`","Off in production unless `ENABLE_DEMO_DATA=true`"],["Secrets","Keys leaking through the repo or logs","`backend/.env` (git-ignored), `.dockerignore`, `lib/redact.js`","Only `.env.example` is tracked; every log line scrubbed of API keys and bearer tokens"],["Test-call isolation","Rehearsals polluting real data","`simulatorService.js`, `callHistoryService.js`, `outcomes.js`","No caller memory, no real SMS"],["Scam shield","Fraud scripts (digital arrest, fake courier, KYC/SIM block, impostor relative, prize) and OTP/PIN/remote-app requests reaching the owner or getting answers","`workflows/scam.js`, `engine.js` step 0, `callSession.js` alert","On for every account; skipped for VIPs and always-transfer callers; delivery OTPs at the door allowed"],["Pack refusal rules","Medical advice, allergen promises, fixed quotes, mark guarantees, treatment-safety calls, religion/caste/diet property filters","`packs/*.js` `guardrails.refuse`, `engine.js` `refusalFor`, model `restricted` label","On when the pack is installed"],["Record privacy","Order, report or fee , risk, action status","Every call (saved on the call)","—","Live"],["Per-flow stats","Runs, completed, transferred, average turns and questions (30 days)","`GET /api/workflows`","—","Live"],["Speech eval on real Indian voices","Word error rate, language detection, facts from audio, reply latency","Planned (Phase 1B/1C)","≥ 95% facts clean, ≥ 90% noisy, ≤ 1.5 s p95","Planned"],["CI pipeline","Backend tests, understanding gate, web lint and build, Docker build, dependency audit","GitHub Actions on every push and pull request (`.github/workflows/ci.yml`)","All jobs green","Live"]]}},{"title":"Tech stack","table":{"cols":["Layer","Components and versions"],"rows":[["Backend","Node.js ≥ 20 (22 in Docker), Express 5.2, Mongoose 8.23, Socket.io 4.8, ws 8, helmet 8, express-rate-limit 8, jsonwebtoken 9, winston 3, axios 1"],["AI","@anthropic-ai/sdk 0.131 (Claude Opus 5.5 by default, optional fast model e.g. Haiku 4.5); OpenAI Realtime (gpt-realtime-mini, gpt-4o-mini-transcribe); OpenAI chat gpt-4.1-mini as fallback"],["Telephony and messaging","twilio 5.12 (Voice, Media Streams, Conference, SMS, Verify); firebase-admin 13.8 (push)"],["Data","MongoDB 7 (Docker) or embedded mongodb-memory-server 11 in development; recordings on local disk"],["Web app","React 19, React Router 7, Vite 8, TypeScript 6, lucide-react, socket.io-client 4.8; installable PWA (manifest + service worker)"],["Mobile app","React Native 0.84, React 19.2, React Navigation 7 (uses the same API)"],["Deploy","Multi-stage Dockerfile (node:22-alpine) serving API + web; docker-compose with mongo:7"],["Demo and evals","playwright-core 1.63, macOS speech synthesis, Swift AVFoundation encoder; node:test; custom NLU eval runner"]]}},{"title":"Switches","table":{"cols":["Env flag","Effect","Default"],"rows":[["`ANTHROPIC_API_KEY`","Turns on Claude for all text intelligence","Unset → OpenAI chat, else offline rules"],["`ANTHROPIC_MODEL`","Main model (analysis, translation, commands)","claude-opus-5-5"],["`ANTHROPIC_FAST_MODEL`","Model for per-turn understanding, reply translation, directions","Same as main"],["`ANTHROPIC_FALLBACKS`","Server-side refusal fallback","On (`off` disables)"],["`NLU_TIMEOUT_MS` / `NLU_DISABLED`","Per-turn model budget / switch the model off","5000 ms / on"],["`OPENAI_API_KEY`, `OPENAI_ENDPOINT`, `OPENAI_DEPLOYMENT_NAME`","Live voice (Azure if endpoint set)","Unset → live voice off; gpt-realtime-mini"],["`TWILIO_ACCOUNT_SID` / `TWILIO_AUTH_TOKEN` / `TWILIO_PHONE_NUMBER`","Live calls, SMS, OTP","Unset → app and test calls only"],["`TWILIO_VERIFY_SERVICE_SID`","OTP via Twilio Verify","Unset → plain SMS"],["`TWILIO_VALIDATE_SIGNATURE`","Force webhook signature checks","On in production"],["`WEBHOOK_URL`","Public base URL for Twilio","http://localhost:3000"],["`BARGE_IN_MS`","How long a caller must talk over Vexa to interrupt","600 ms"],["`DEFAULT_COUNTRY_CODE`","Country for 10-digit spoken numbers","+91"],["`RECORDINGS_DIR`","Where recordings are stored","backend/.data/recordings"],["`FIREBASE_SERVICE_ACCOUNT`","Push notifications","Unset → off"],["`MONGODB_URI`","Database","Embedded in development; required in production"],["`JWT_SECRET`, `JWT_EXPIRES_IN`, `JWT_REFRESH_EXPIRES_IN`","Token signing and lifetimes","Required in production; 7 d; 30 d"],["`ENABLE_DEMO_DATA`","Demo routes in production","Off"],["`OTP_FORCE_SMS`","Send real codes in development","Off"],["`STREAM_TOKEN_SECRET`","Signs the per-call audio stream token","Derived from `JWT_SECRET`"],["`MIN_APP_VERSION` / `LATEST_APP_VERSION`","Android app forced / suggested update","Unset"]]}},{"title":"Known gaps (from the code)","bullets":["The live phone path (Twilio + OpenAI Realtime) is complete in code but has not run on a real call; no keys are configured.","Active calls, test sessions and rate-limit counters live in memory: one server instance only, and a restart drops live calls.","Unused code and dependencies: `config/redis.js`, `pg`, `bcrypt`.","Per-turn replies take 2–9 s on Opus; a fast model (e.g. Haiku) is recommended for live calls."]}]}</script>

<script>
(function () {
  const W = JSON.parse(document.getElementById('workflow-data').textContent);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  // Inline `code` and **bold** in body text, after escaping.
  const rich = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  if (location.hash === '#diagram' || new URLSearchParams(location.search).has('diagram')) document.body.classList.add('diagram-only');

  document.title = W.title;
  document.getElementById('title').textContent = W.title;
  document.getElementById('subtitle').textContent = W.subtitle || '';
  document.getElementById('meta').innerHTML = (W.meta || []).map(m => `<dt>${esc(m.k)}</dt><dd>${rich(m.v)}</dd>`).join('');

  const KIND_LABEL = {
    actor: 'People and UI', service: 'Service code (deterministic)', llm: 'LLM call', embedding: 'Embedding call',
    api: 'Platform / integration API', platform: 'Platform or data service', optional: 'Optional (config switch)',
    notintegrated: 'Not integrated yet', guardrail: 'Guardrail', eval: 'Eval / quality check',
  };
  const phases = W.phases, lanes = W.lanes;
  const colW = p => p.gap ? '46px' : `${p.width || 236}px`;
  const grid = document.createElement('div');
  grid.className = 'grid';
  grid.style.gridTemplateColumns = `150px ${phases.map(colW).join(' ')}`;

  // Row 1: use-case bands spanning their phases.
  grid.insertAdjacentHTML('beforeend', '<div></div>');
  let col = 2;
  const ucOf = id => (W.useCases || []).find(u => u.phases.includes(id));
  for (let i = 0; i < phases.length;) {
    const uc = ucOf(phases[i].id);
    if (!uc) { grid.insertAdjacentHTML('beforeend', `<div style="grid-column:${col}"></div>`); i++; col++; continue; }
    let span = 0; while (i + span < phases.length && ucOf(phases[i + span].id) === uc) span++;
    grid.insertAdjacentHTML('beforeend', `<div class="uc" style="grid-column:${col} / span ${span}">${esc(uc.id)}&nbsp; ${esc(uc.title)}</div>`);
    i += span; col += span;
  }
  // Row 2: phase headers.
  grid.insertAdjacentHTML('beforeend', '<div></div>');
  phases.forEach(p => grid.insertAdjacentHTML('beforeend', p.gap ? '<div></div>' : `<div class="ph">${esc(p.title)}</div>`));
  // Lane rows.
  lanes.forEach((lane, li) => {
    grid.insertAdjacentHTML('beforeend', `<div class="lanehead"><b>${esc(lane.title)}</b><span>${esc(lane.subtitle || '')}</span></div>`);
    phases.forEach(p => {
      if (p.gap) {
        if (li === 0) grid.insertAdjacentHTML('beforeend', `<div class="gapcol" style="grid-row: span ${lanes.length}"><span>${esc(p.text || '')}</span></div>`);
        return;
      }
      const boxes = (W.boxes || []).filter(b => b.phase === p.id && b.lane === lane.id);
      grid.insertAdjacentHTML('beforeend', `<div class="cell">${boxes.map(b => `
        <div class="box k-${esc(b.kind)}">
          ${b.badge ? `<div class="badge">${esc(b.badge)}</div>` : ''}
          <div class="tag">${esc(b.tag || KIND_LABEL[b.kind] || '')}</div>
          <div class="t">${esc(b.title)}</div>
          <div class="b">${rich(b.body || '')}</div>
        </div>`).join('')}</div>`);
    });
  });
  const used = [...new Set((W.boxes || []).map(b => b.kind))];
  const legend = `<div class="legend"><b style="color:var(--ink)">Legend</b>${used.map(k => `<span><i class="k-${k}"></i>${esc(KIND_LABEL[k] || k)}</span>`).join('')}<span><i class="n"></i>Step in the walkthrough</span></div>`;
  const foot = `<div class="foot"><span>${rich(W.footnote || '')}</span><span>${rich(W.source || '')}</span></div>`;
  const d = document.getElementById('diagram');
  d.appendChild(grid);
  d.insertAdjacentHTML('beforeend', legend + foot);

  // Readout text: step walkthrough, then tables / bullet sections.
  const t = [];
  if (W.steps) {
    t.push(`<h2>The flow, step by step</h2><p class="intro">Numbers match the badges in the diagram.</p>`);
    W.steps.forEach(g => {
      t.push(`<h3>${esc(g.group)}</h3><ol class="steps">${g.items.map(s => `<li><span class="num">${esc(s.n ?? '·')}</span><span>${rich(s.text)}</span></li>`).join('')}</ol>`);
    });
  }
  (W.sections || []).forEach(s => {
    t.push(`<h2>${esc(s.title)}</h2>`);
    if (s.intro) t.push(`<p class="intro">${rich(s.intro)}</p>`);
    if (s.table) t.push(`<table><thead><tr>${s.table.cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${s.table.rows.map(r => `<tr>${r.map(c => `<td>${rich(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`);
    if (s.bullets) t.push(`<ul class="bul">${s.bullets.map(b => `<li>${rich(b)}</li>`).join('')}</ul>`);
  });
  document.getElementById('text').innerHTML = t.join('');
})();
</script>
</body>
</html>
