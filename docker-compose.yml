# Production-like local stack: API + dashboard + MongoDB.
#   JWT_SECRET=$(openssl rand -hex 32) docker compose up --build
services:
  mongo:
    image: mongo:7
    volumes: [mongo-data:/data/db]
  vexa:
    build: .
    ports: ["3000:3000"]
    env_file:
      - path: backend/.env
        required: false
    environment:
      MONGODB_URI: mongodb://mongo:27017/vexa
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
    depends_on: [mongo]
volumes:
  mongo-data:
